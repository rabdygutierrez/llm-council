<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Casos de Prueba</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #666; margin-bottom: 24px; }
  .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid #e0e0e0; }
  label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; }
  textarea { width: 100%; min-height: 150px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical; line-height: 1.6; }
  textarea:focus { outline: none; border-color: #6b5ce7; }
  .tipos { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .tipo-btn { padding: 8px 16px; border-radius: 20px; border: 2px solid; cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity 0.2s; background: none; }
  .tipo-btn.positivo { border-color: #2e7d32; background: #e8f5e9; color: #1b5e20; }
  .tipo-btn.negativo { border-color: #c62828; background: #ffebee; color: #7f0000; }
  .tipo-btn.borde    { border-color: #e65100; background: #fff3e0; color: #bf360c; }
  .tipo-btn.inactivo { opacity: 0.35; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .row label { margin-bottom: 0; white-space: nowrap; }
  input[type=range] { flex: 1; }
  .fmt-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .fmt-btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 13px; }
  .fmt-btn.activo { background: #6b5ce7; color: white; border-color: #6b5ce7; }
  .generar { width: 100%; padding: 14px; background: #6b5ce7; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .generar:hover { background: #5a4bd1; }
  .generar:disabled { background: #aaa; cursor: not-allowed; }
  .loading { text-align: center; padding: 24px; color: #666; display: none; }
  .resultado { display: none; }
  .resultado-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .resultado-header span { font-weight: 600; font-size: 14px; }
  .copiar { padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; font-size: 12px; }
  .copiar:hover { background: #f0f0f0; }
  pre { background: #f8f8f8; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; font-family: 'Courier New', monospace; max-height: 500px; overflow-y: auto; }
  .error { background: #ffebee; border: 1px solid #f44336; border-radius: 8px; padding: 12px; color: #c62828; font-size: 13px; display: none; margin-top: 12px; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #ddd; border-top-color: #6b5ce7; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<h1>🧪 Generador de Casos de Prueba</h1>
<p class="subtitle">Pega tu Historia de Usuario y obtén casos positivos, negativos y de borde</p>

<div class="card">
  <label>Historia de Usuario</label>
  <textarea id="hu" placeholder="Ejemplo: Como usuario registrado, quiero iniciar sesión con mi email y contraseña para acceder a mi cuenta.

Criterios de aceptación:
- El email debe tener formato válido
- La contraseña debe tener mínimo 8 caracteres
- Después de 3 intentos fallidos, la cuenta se bloquea por 5 minutos"></textarea>
</div>

<div class="card">
  <label>Tipos de casos a generar</label>
  <div class="tipos">
    <div class="tipo-btn positivo" id="btn-positivo" onclick="toggle('positivo')">✅ Positivos</div>
    <div class="tipo-btn negativo" id="btn-negativo" onclick="toggle('negativo')">❌ Negativos</div>
    <div class="tipo-btn borde"    id="btn-borde"    onclick="toggle('borde')">⚠️ Borde</div>
  </div>

  <div class="row">
    <label>Casos por tipo:</label>
    <input type="range" min="2" max="8" value="4" id="cantidad" oninput="document.getElementById('cant-val').textContent=this.value">
    <strong id="cant-val">4</strong>
  </div>

  <label style="margin-bottom:8px">Formato de salida</label>
  <div class="fmt-btns">
    <button class="fmt-btn activo" id="fmt-tabla"   onclick="setFmt('tabla')">📋 Tabla</button>
    <button class="fmt-btn"        id="fmt-gherkin" onclick="setFmt('gherkin')">🥒 Gherkin</button>
    <button class="fmt-btn"        id="fmt-libre"   onclick="setFmt('libre')">📝 Texto libre</button>
  </div>
</div>

<button class="generar" id="btn-generar" onclick="generar()">⚡ Generar casos de prueba</button>

<div class="loading" id="loading">
  <span class="spinner"></span> Generando casos de prueba con IA...
</div>

<div class="resultado" id="resultado">
  <div class="resultado-header">
    <span>Casos de prueba generados</span>
    <button class="copiar" onclick="copiar()">📋 Copiar todo</button>
  </div>
  <pre id="resultado-texto"></pre>
</div>

<div class="error" id="error"></div>

<script>
const activos = { positivo: true, negativo: true, borde: true };
let formato = 'tabla';

// ← ÚNICO CAMBIO: apunta al proxy local en vez de api.anthropic.com
const API_URL = '/v1/messages';

function toggle(tipo) {
  activos[tipo] = !activos[tipo];
  document.getElementById('btn-' + tipo).classList.toggle('inactivo', !activos[tipo]);
}

function setFmt(fmt) {
  formato = fmt;
  ['tabla','gherkin','libre'].forEach(f => {
    document.getElementById('fmt-' + f).classList.toggle('activo', f === fmt);
  });
}

async function generar() {
  const hu = document.getElementById('hu').value.trim();
  if (!hu) { mostrarError('Por favor ingresa una Historia de Usuario.'); return; }

  const tipos = Object.entries(activos).filter(([,v])=>v).map(([k])=>k);
  if (!tipos.length) { mostrarError('Selecciona al menos un tipo de caso.'); return; }

  const cantidad = document.getElementById('cantidad').value;
  const fmtDesc = {
    tabla: 'una tabla Markdown con columnas: ID | Tipo | Descripción | Precondiciones | Pasos | Datos de entrada | Resultado esperado',
    gherkin: 'formato Gherkin con Scenario, Given, When, Then para cada caso',
    libre: 'texto libre descriptivo y detallado para cada caso'
  }[formato];

  const tiposTexto = tipos.map(t => ({
    positivo: 'POSITIVOS (flujos válidos y exitosos, IDs: CP-P01, CP-P02...)',
    negativo: 'NEGATIVOS (entradas inválidas, errores, accesos no permitidos, IDs: CP-N01...)',
    borde:    'BORDE (valores límite, mínimos/máximos, campos vacíos, IDs: CP-B01...)'
  })[t]).join('\n- ');

  const prompt = `Eres un QA Engineer experto. Genera casos de prueba a partir de esta Historia de Usuario.

HISTORIA DE USUARIO:
${hu}

INSTRUCCIONES:
- Genera exactamente ${cantidad} casos de prueba para cada uno de estos tipos:
- ${tiposTexto}
- Usa este formato: ${fmtDesc}
- Cada caso debe ser específico, accionable y trazable a la HU
- Organiza el resultado por secciones con encabezado por tipo`;

  ocultarError();
  document.getElementById('loading').style.display = 'block';
  document.getElementById('resultado').style.display = 'none';
  document.getElementById('btn-generar').disabled = true;

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const texto = (data.content || []).map(b => b.text || '').join('');
    if (!texto) throw new Error('No se recibió respuesta.');
    document.getElementById('resultado-texto').textContent = texto;
    document.getElementById('resultado').style.display = 'block';
  } catch(e) {
    mostrarError('Error: ' + e.message);
  } finally {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('btn-generar').disabled = false;
  }
}

function copiar() {
  navigator.clipboard.writeText(document.getElementById('resultado-texto').textContent);
}
function mostrarError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}
function ocultarError() {
  document.getElementById('error').style.display = 'none';
}
</script>
</body>
</html>
